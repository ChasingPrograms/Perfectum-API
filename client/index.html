<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Perfectum </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="stylesheet.css">
    <script src="app.js" defer> </script>
</head>
<body>
    <header>
        <h1 id="Title"> PERFECTUM </h1>
        <p> Making your goals simpler </p>
    </header>
    
    <main>
        <!-- YOUR GOALS TAB -->
        <section class = "outercard">
            <h2 class ="tabHeader"> Your Goals </h2>
            <div class ="innercard">
                <p id = "emptyActive" class ="emptyStatep"> Create Your First Goal </p>
                <ul id ="activeList" class = "goalList"></ul>
                <button class = "pillButton addNewGoalButton" id = "addNewGoal"> Add New Goal </button>            
            </div>
        </section>


        <!-- INACTIVE GOALS TAB -->
        <section class = "outercard">
            <h2 class ="tabHeader"> Inactive Goals </h2>
            <div class="innercard">
                <p id = "emptyInactive" class ="emptyStatep"> No Archived Goals </p>
                <ul id ="inactiveList" class = "goalList"></ul>
            </div>
        </section>
    </main>

    <dialog id="openNewGoalModal"> 
        <div class="modalHeader">
            <div></div>
            <h1> Create A New Goal </h1>
            <button id="closeNewGoalModal" class="closeButton" aria-label="Close">✕</button>
        </div>
        <form id="newGoalForm"> 
                <label for="goalTitle"> <b>Title</b> <i> (required) </i></label>
                <input type="text" id="goalTitle" name="goalTitle" required maxlength="100" placeholder="Create a title for your goal!">
                <p id="titleCounter" class="counter">(0/100)</p>
                <label for="goalDescription"> <b>Description</b> <i>(optional)</i></label>
                <textarea id="goalDescription" name="goalDescription" maxlength="500" placeholder="Describe your goal!"></textarea>
                <p id="descCounter" class="counter">(0/500)</p>
            </form>
    </dialog>
    
</body>
</html>
